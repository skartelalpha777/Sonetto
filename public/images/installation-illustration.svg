<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360">
  <rect width="480" height="360" rx="20" fill="#eef3fc"/>

  <!-- Mur -->
  <rect x="40" y="40" width="180" height="280" rx="12" fill="#dbe3ee"/>

  <!-- Sonnette en cours d'installation -->
  <rect x="105" y="130" width="60" height="120" rx="12" fill="#0b1e3d" stroke="#2563eb" stroke-width="2"/>
  <circle cx="135" cy="165" r="15" fill="#13294b" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="135" cy="165" r="5" fill="#60a5fa"/>
  <rect x="120" y="195" width="30" height="8" rx="4" fill="#25d366"/>

  <!-- Technicien (silhouette stylisée) -->
  <g transform="translate(230,60)">
    <circle cx="60" cy="34" r="26" fill="#2563eb"/>
    <rect x="20" y="60" width="80" height="130" rx="24" fill="#13294b"/>
    <rect x="0" y="70" width="26" height="90" rx="13" fill="#13294b"/>
    <rect x="94" y="70" width="26" height="90" rx="13" fill="#13294b"/>
    <!-- Casquette -->
    <path d="M34 24a26 26 0 0 1 52 0z" fill="#0b1e3d"/>
    <!-- Tournevis dans la main -->
    <rect x="-6" y="150" width="10" height="46" rx="4" fill="#64748b" transform="rotate(20 -6 150)"/>
  </g>

  <!-- Outils au sol -->
  <rect x="330" y="290" width="90" height="10" rx="5" fill="#94a3b8"/>
  <circle cx="345" cy="285" r="8" fill="#2563eb"/>
  <rect x="360" y="278" width="40" height="14" rx="4" fill="#64748b"/>

  <!-- Badge check -->
  <g transform="translate(340,60)">
    <circle cx="20" cy="20" r="20" fill="#22c55e"/>
    <path d="M11 21l6 6 12-13" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
